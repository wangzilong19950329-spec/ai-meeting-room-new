server:
  port: 8080

spring:
  datasource:
    url: ${AI_MEETING_DB_URL:jdbc:mysql://127.0.0.1:3306/ai_meeting?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${AI_MEETING_DB_USERNAME:ai_meeting}
    password: ${AI_MEETING_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    protocol: smtp
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.ssl.enable: ${SMTP_SSL_ENABLE:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS_ENABLE:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000
  task:
    scheduling:
      thread-name-prefix: aimeeting-scheduler-
      pool:
        size: ${AI_MEETING_SCHEDULING_POOL_SIZE:${STOCK_WATCH_SCHEDULING_POOL_SIZE:3}}
      shutdown:
        await-termination: true
        await-termination-period: 30s

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.aimeeting.room.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.aimeeting.room: DEBUG

# AI 模型配置
ai:
  # 默认模型（未指定时使用，集群分析/会议总结等内部调用）
  default-model: deepseek-chat

  models:
    # OpenAI / 兼容 OpenAI 格式的接口（Azure, 本地 Ollama 等）
    openai:
      api-url: https://api.openai.com/v1/chat/completions
      api-key: sk-your-openai-key
      enabled: true

    # Anthropic Claude
    claude:
      api-url: https://api.anthropic.com/v1/messages
      api-key: sk-ant-your-claude-key
      api-version: "2023-06-01"
      enabled: false

    # 通义千问
    tongyi:
      api-url: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
      api-key: your-dashscope-key
      enabled: false

    # 文心一言
    wenxin:
      api-url: https://aip.baidubce.com/rpc/2.0/ai_custom/v1/wenxinworkshop/chat/completions_pro
      api-key: your-wenxin-key
      secret-key: your-wenxin-secret
      enabled: false

    # DeepSeek
    deepseek:
      api-url: https://api.deepseek.com/v1/chat/completions
      api-key: ${DEEPSEEK_API_KEY:}
      enabled: ${DEEPSEEK_ENABLED:false}

  # 搜索配置（可选，配置后议员将联网获取实时资讯）
  search:
    provider-order: tavily,deepseek-web,zhipu,serper
    serper-api-key: ${SERPER_API_KEY:}   # 从 https://serper.dev 免费获取，填入环境变量后启用真实搜索
    tavily:                              # 中文友好，作为默认优先搜索源；支持 include_domains 定向搜索
      api-key: ${TAVILY_API_KEY:}        # 从 https://tavily.com 获取，填入环境变量后启用
      api-url: https://api.tavily.com/search
      search-depth: advanced             # basic / advanced
      include-answer: false              # 金融证据只保留网页原始结果，避免把 Tavily 智能摘要当成事实来源
      country: ""                        # 留空自动判断；可填 china 偏向中文站点
      timeout-seconds: 30
    zhipu:
      api-key: ${ZHIPU_API_KEY:}
      api-url: https://open.bigmodel.cn/api/paas/v4/web_search
      digest-enabled: true
      digest-api-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
      digest-model: glm-4-flash-250414
      digest-timeout-seconds: 60
      search-engine: search_std
      recency-filter: noLimit
      content-size: medium
      timeout-seconds: 60
    deepseek-web:
      enabled: false
      mode: fast
      bridge-url: http://127.0.0.1:8789/search
      node-command: node
      script-path: scripts/deepseek-web-search.js
      timeout-seconds: 150
      read-timeout-seconds: 320

  # 会议配置
  meeting:
    async-thread-pool-size: 5
    max-rounds-default: 10
    consensus-threshold: 0.70
    min-agreement-count: 2
    base-reward: 100
    base-penalty: 50
    dissent-penalty-factor: 0.3
    deepseek-web-bridge:
      enabled: ${AI_MEETING_DEEPSEEK_WEB_BRIDGE_ENABLED:false}
      bridge-url: ${AI_MEETING_DEEPSEEK_WEB_BRIDGE_URL:${ai.search.deepseek-web.bridge-url:http://127.0.0.1:8789/search}}
      connect-timeout-seconds: ${AI_MEETING_DEEPSEEK_WEB_BRIDGE_CONNECT_TIMEOUT_SECONDS:10}
      read-timeout-seconds: ${AI_MEETING_DEEPSEEK_WEB_BRIDGE_READ_TIMEOUT_SECONDS:480}
      mode: ${AI_MEETING_DEEPSEEK_WEB_BRIDGE_MODE:expert}
      search-mode: ${AI_MEETING_DEEPSEEK_WEB_BRIDGE_SEARCH_MODE:fast}
      serialized: ${AI_MEETING_DEEPSEEK_WEB_BRIDGE_SERIALIZED:true}
  tracking:
    refresh:
      enabled: ${AI_TRACKING_REFRESH_ENABLED:true}
      batch-size: ${AI_TRACKING_REFRESH_BATCH_SIZE:2}
      scan-interval-ms: ${AI_TRACKING_REFRESH_SCAN_INTERVAL_MS:60000}
      initial-delay-ms: ${AI_TRACKING_REFRESH_INITIAL_DELAY_MS:20000}

# 通知配置
notification:
  serverchan-key: ${SERVERCHAN_KEY:}   # Server酱 key，从 https://sct.ftqq.com 获取，填入后启用微信推送
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    from: ${NOTIFICATION_EMAIL_FROM:}
    to: ${NOTIFICATION_EMAIL_TO:}      # 多个收件人用英文逗号分隔

# 股票盯盘后端定时器。页面关闭后仍可运行；机器睡眠后仍会暂停。
stock-watch:
  monitor:
    enabled: ${STOCK_WATCH_MONITOR_ENABLED:true}
    notify-enabled: ${STOCK_WATCH_NOTIFY_ENABLED:true}
    trading-hours-only: ${STOCK_WATCH_TRADING_HOURS_ONLY:true}
    scan-interval-ms: ${STOCK_WATCH_SCAN_INTERVAL_MS:600000}
    initial-delay-ms: ${STOCK_WATCH_INITIAL_DELAY_MS:30000}
    symbols: ${STOCK_WATCH_SYMBOLS:688017.sh,300760.sz,002594.sz}
    ai-alert-cooldown-minutes: ${STOCK_WATCH_AI_ALERT_COOLDOWN_MINUTES:30}
    ai-context-technical-lookback-days: ${STOCK_WATCH_AI_CONTEXT_TECHNICAL_LOOKBACK_DAYS:14}
    ai-context-technical-limit: ${STOCK_WATCH_AI_CONTEXT_TECHNICAL_LIMIT:48}
    ai-context-technical-max-chars: ${STOCK_WATCH_AI_CONTEXT_TECHNICAL_MAX_CHARS:16000}
    # 旧版价格规则仅在显式配置 STOCK_WATCH_RULES 时启用，禁止注入不可见的演示规则。
    # 格式：symbol.market:ruleId:support:requiredBreakDays:severity
    rules: ${STOCK_WATCH_RULES:}
    state-file: ${STOCK_WATCH_STATE_FILE:}
  ai-rules:
    store-file: ${STOCK_WATCH_AI_RULES_FILE:}
    default-model: ${STOCK_WATCH_AI_MODEL:deepseek-chat}
    bridge-url: ${STOCK_WATCH_AI_RULES_BRIDGE_URL:${STOCK_WATCH_TECH_BRIDGE_URL:http://127.0.0.1:8791/search}}
    bridge-first: ${STOCK_WATCH_AI_RULES_BRIDGE_FIRST:false}
    bridge-connect-timeout-seconds: ${STOCK_WATCH_AI_RULES_BRIDGE_CONNECT_TIMEOUT_SECONDS:10}
    bridge-read-timeout-seconds: ${STOCK_WATCH_AI_RULES_BRIDGE_READ_TIMEOUT_SECONDS:210}
  technical-analysis:
    enabled: ${STOCK_WATCH_TECH_ANALYSIS_ENABLED:true}
    trading-hours-only: ${STOCK_WATCH_TECH_TRADING_HOURS_ONLY:true}
    scan-interval-ms: ${STOCK_WATCH_TECH_SCAN_INTERVAL_MS:1800000}
    initial-delay-ms: ${STOCK_WATCH_TECH_INITIAL_DELAY_MS:90000}
    symbols: ${STOCK_WATCH_TECH_SYMBOLS:${STOCK_WATCH_SYMBOLS:688017.sh,300760.sz,002594.sz}}
    context-limit-chars: ${STOCK_WATCH_TECH_CONTEXT_LIMIT_CHARS:500000}
    context-rotate-ratio: ${STOCK_WATCH_TECH_CONTEXT_ROTATE_RATIO:1.0}
    bridge-url: ${STOCK_WATCH_TECH_BRIDGE_URL:http://127.0.0.1:8791/search}
    debug-port: ${STOCK_WATCH_TECH_DEBUG_PORT:9344}
    connect-timeout-seconds: ${STOCK_WATCH_TECH_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${STOCK_WATCH_TECH_READ_TIMEOUT_SECONDS:320}
    task-stale-after-seconds: ${STOCK_WATCH_TECH_TASK_STALE_AFTER_SECONDS:420}
    reconcile-interval-ms: ${STOCK_WATCH_TECH_RECONCILE_INTERVAL_MS:60000}
    reconcile-initial-delay-ms: ${STOCK_WATCH_TECH_RECONCILE_INITIAL_DELAY_MS:120000}
    reconcile-batch-size: ${STOCK_WATCH_TECH_RECONCILE_BATCH_SIZE:20}
    v6-mode: ${STOCK_WATCH_V6_MODE:runtime}
  delivery:
    enabled: ${STOCK_WATCH_DELIVERY_ENABLED:true}
    scan-interval-ms: ${STOCK_WATCH_DELIVERY_SCAN_INTERVAL_MS:300000}
    initial-delay-ms: ${STOCK_WATCH_DELIVERY_INITIAL_DELAY_MS:45000}
    batch-limit: ${STOCK_WATCH_DELIVERY_BATCH_LIMIT:100}
