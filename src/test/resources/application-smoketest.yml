server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:smoketest;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-local.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

stock-watch:
  technical-analysis:
    v6-mode: disabled

# 关闭后台追踪刷新调度，避免干扰冒烟测试
ai:
  tracking:
    refresh:
      enabled: false
